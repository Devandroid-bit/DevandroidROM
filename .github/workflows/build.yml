
name: Build DevandroidROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        target: [d1, d1xks, d2s, d2x, d2xks]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a --force

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner kernel: $(uname -r)"
          lsb_release -a || true

          sudo apt-get update

          PACKAGES=(
            p7zip-full
            jq
            attr
            ccache
            clang
            ffmpeg
            golang
            libbrotli-dev
            libgtest-dev
            libprotobuf-dev
            libunwind-dev
            libpcre2-dev
            libzstd-dev
            lld
            protobuf-compiler
            webp
            curl
            xxd
            patchelf
            flex
            bison
            libarchive-tools
            build-essential
            pcre2-utils
          )

          # Avoid requesting an unavailable Azure kernel package.
          KERNEL_VERSION="$(uname -r)"
          KERNEL_MAJOR="${KERNEL_VERSION%%.*}"

          if (( KERNEL_MAJOR < 7 )); then
            PACKAGES+=("linux-modules-extra-${KERNEL_VERSION}")
          fi

          sudo apt-get install -y "${PACKAGES[@]}"

          # Verify and load required filesystem modules.
          for module in erofs f2fs; do
            if ! sudo modprobe "$module"; then
              echo "::error::Unable to load required kernel module: $module"
              modinfo "$module" || true
              exit 1
            fi

            echo "Successfully loaded: $module"
          done

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Restore platform signing keys.
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/extremerom_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/extremerom_platform.x509.pem

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Fix script permissions
        run: |
          echo "Fixing permissions for all shell scripts..."

          find . -type f -name "*.sh" -exec chmod +x {} \;
          find ./scripts -type f -exec chmod +x {} \;

          chmod +x ./scripts/make_rom.sh
          chmod +x ./scripts/internal/build_flashable_zip.sh

          echo "Verifying permissions:"
          ls -la ./scripts/make_rom.sh
          ls -la ./scripts/internal/build_flashable_zip.sh

          echo "All script permissions fixed!"

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --force --ignore-target

      - name: Extract source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --force --ignore-target

      - name: Download target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --force --ignore-source

      - name: Extract target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --force --ignore-source

      - name: Create Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile

          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "Active swap:"
          sudo swapon --show
          free -h

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --force

      - name: Upload ROM to GoFile
        run: |
          set -euo pipefail

          ROM_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ROM_FILE" ]; then
            echo "::error::Flashable ZIP not found!"
            exit 1
          fi

          echo "Found ROM ZIP: $ROM_FILE"
          echo "Uploading to GoFile..."

          RESPONSE=$(curl --fail-with-body -sS \
            -F "file=@${ROM_FILE}" \
            -F "token=${{ secrets.GOFILE_TOKEN }}" \
            -F "folderId=${{ secrets.GOFILE_FOLDER }}" \
            "https://upload-eu-par.gofile.io/uploadFile")

          echo "GoFile response:"
          echo "$RESPONSE" | jq .

          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::GoFile upload failed or returned no download URL."
            exit 1
          fi

          echo "Upload successful!"
          echo "Download link: $DOWNLOAD_URL"
